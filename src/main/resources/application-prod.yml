# 生产环境不读取本地 .env，连接参数由部署环境提供。
spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=10000"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
